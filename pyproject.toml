[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-log-analyzer"
version = "0.1.0"
description = "Production-grade log parser with timezone handling"
readme = "README.md"
authors = [
    {name = "Bernard Omondi", email = "bernard@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "streamlit>1.30.0",
    "requests>=2.31.0",
    "psycopg[binary]>=3.1.0",			
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

# Relax the strictness
disallow_untyped_defs = false
check_untyped_defs = false
